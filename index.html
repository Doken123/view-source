<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bongkar Source</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Bricolage+Grotesque:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12161f; --panel:#1a2030; --code:#0d1119; --line:#2a3246;
  --text:#e8ecf4; --mute:#8d97ad; --acc:#ffb547; --acc-ink:#2a1a00;
  --html:#ff7a59; --css:#5aa9ff; --js:#f5d547; --err:#ff6b81;
  --sans:'Bricolage Grotesque',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:light){
  :root{--bg:#f4f1ea;--panel:#fff;--code:#fbfaf7;--line:#ddd6c6;--text:#1c2030;--mute:#6b7186;--acc:#c46a00;--acc-ink:#fff;--html:#d9482a;--css:#1f6fd1;--js:#a07d00;--err:#c0213d}
}
*{box-sizing:border-box}
html{scroll-padding-top:12px}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--sans);min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding:28px 16px 48px}

h1{font-size:clamp(1.9rem,6vw,3rem);line-height:1;margin:0 0 8px;font-weight:800;letter-spacing:-.03em}
.lead{color:var(--mute);margin:0 0 22px;max-width:46ch}

form{display:flex;gap:0;border:1.5px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
form:focus-within{border-color:var(--acc)}
form input{flex:1;min-width:0;border:0;background:transparent;color:var(--text);padding:15px 16px;font:500 15px var(--mono);outline:0}
form input::placeholder{color:var(--mute)}
form button{border:0;background:var(--acc);color:var(--acc-ink);font:700 15px var(--sans);padding:0 22px;cursor:pointer}
form button:disabled{opacity:.6;cursor:wait}
form button:focus-visible{outline:2px solid var(--text);outline-offset:-4px}

#status{min-height:24px;margin:12px 2px;font-size:13.5px;color:var(--mute);display:flex;align-items:center;gap:8px}
#status.err{color:var(--err)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--acc);animation:p 1s infinite}
@keyframes p{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}

#result{display:none}
#result.on{display:block}

.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.tab{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--text);cursor:pointer;text-align:left;font-family:var(--sans)}
.tab b{display:block;font-size:1.05rem;display:flex;align-items:center;gap:8px}
.tab b::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c)}
.tab small{color:var(--mute);font:400 12px var(--mono)}
.tab[data-t=html]{--c:var(--html)} .tab[data-t=css]{--c:var(--css)} .tab[data-t=js]{--c:var(--js)}
.tab[aria-selected=true]{border-color:var(--c);box-shadow:inset 0 -3px 0 var(--c)}
.tab:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

.files{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:4px;scrollbar-width:thin}
.chip{flex:none;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:transparent;border:1px solid var(--line);color:var(--mute);border-radius:999px;padding:5px 12px;font:12px var(--mono);cursor:pointer}
.chip[aria-pressed=true]{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip:focus-visible{outline:2px solid var(--acc)}

.viewer{border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--code)}
.bar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.bar .name{flex:1;min-width:0;font:12.5px var(--mono);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{background:transparent;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 12px;font:600 13px var(--sans);cursor:pointer}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

.scroll{display:flex;max-height:70vh;overflow:auto;font:12.5px/1.65 var(--mono)}
.gutter,.src{margin:0;padding:14px 0;white-space:pre}
.gutter{position:sticky;left:0;flex:none;min-width:48px;padding:14px 10px 14px 12px;text-align:right;color:var(--mute);background:var(--code);border-right:1px solid var(--line);user-select:none;opacity:.8}
.src{padding:14px 16px;tab-size:2;color:var(--text);flex:1}
.empty{padding:36px 16px;text-align:center;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:999px;font-weight:600;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <h1>Bongkar Source</h1>
  <p class="lead">Tempel link website, lihat HTML, CSS, dan JavaScript-nya dalam satu tempat.</p>

  <form id="f">
    <input id="url" type="text" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="contoh.com" aria-label="Link website">
    <button id="go" type="submit">Ambil</button>
  </form>
  <div id="status" role="status" aria-live="polite"></div>

  <section id="result">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-t="html"><b>HTML</b><small id="s-html"></small></button>
      <button class="tab" role="tab" data-t="css"><b>CSS</b><small id="s-css"></small></button>
      <button class="tab" role="tab" data-t="js"><b>JS</b><small id="s-js"></small></button>
    </div>
    <div class="files" id="files"></div>
    <div class="viewer">
      <div class="bar">
        <span class="name" id="fname"></span>
        <button class="btn" id="copy">Salin</button>
        <button class="btn" id="dl">Unduh</button>
      </div>
      <div class="scroll" id="scroll"></div>
    </div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
const WORKER = 'https://NAMA-WORKER.USERNAME.workers.dev';
const $ = id => document.getElementById(id);
let D = {html:[], css:[], js:[]}, tab = 'html', idx = 0;

const get = u => fetch(WORKER + '?url=' + encodeURIComponent(u)).then(r => {
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.text();
});
const kb = n => n < 1024 ? n + ' B' : (n/1024).toFixed(1) + ' KB';
const total = a => a.reduce((n, f) => n + f.c.length, 0);

function status(msg, err, busy){
  const s = $('status');
  s.className = err ? 'err' : '';
  s.innerHTML = busy ? '<span class="dot"></span>' : '';
  s.append(msg);
}
function toast(t){
  const e = $('toast'); e.textContent = t; e.classList.add('on');
  setTimeout(() => e.classList.remove('on'), 1400);
}

$('f').addEventListener('submit', async e => {
  e.preventDefault();
  let url = $('url').value.trim();
  if (!url) return;
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
  try { new URL(url) } catch { return status('Link tidak valid.', true) }

  $('go').disabled = true;
  $('result').classList.remove('on');
  status('Mengambil halaman...', false, true);
  try {
    const html = await get(url);
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const abs = h => { try { return new URL(h, url).href } catch { return null } };
    D = {html:[{n:'index.html', c:html}], css:[], js:[]};

    doc.querySelectorAll('style').forEach((s,i) =>
      D.css.push({n:'inline style #' + (i+1), c:s.textContent}));
    doc.querySelectorAll('script:not([src])').forEach((s,i) =>
      s.textContent.trim() && D.js.push({n:'inline script #' + (i+1), c:s.textContent}));

    const jobs = [];
    doc.querySelectorAll('link[rel~=stylesheet][href]').forEach(l => {
      const u = abs(l.getAttribute('href')); u && jobs.push([D.css, u]);
    });
    doc.querySelectorAll('script[src]').forEach(s => {
      const u = abs(s.getAttribute('src')); u && jobs.push([D.js, u]);
    });

    let done = 0;
    await Promise.all(jobs.map(async ([list, u]) => {
      try { list.push({n:u, c:await get(u)}) }
      catch { list.push({n:u, c:'/* gagal diambil */'}) }
      status('Mengambil file ' + (++done) + '/' + jobs.length + '...', false, true);
    }));

    ['html','css','js'].forEach(t => {
      $('s-' + t).textContent = D[t].length + ' file · ' + kb(total(D[t]));
    });
    status('Selesai · ' + new URL(url).hostname);
    $('result').classList.add('on');
    select('html');
  } catch (err) {
    status('Gagal: ' + err.message + '. Cek link atau URL Worker.', true);
  } finally {
    $('go').disabled = false;
  }
});

document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => select(b.dataset.t)));

function select(t){
  tab = t; idx = 0;
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.t === t));
  const box = $('files'); box.innerHTML = '';
  if (D[t].length > 1) {
    D[t].forEach((f, i) => {
      const c = document.createElement('button');
      c.className = 'chip'; c.textContent = f.n.replace(/^https?:\/\//, '');
      c.title = f.n;
      c.onclick = () => { idx = i; render(); };
      box.append(c);
    });
  }
  render();
}

function render(){
  document.querySelectorAll('.chip').forEach((c, i) => c.setAttribute('aria-pressed', i === idx));
  const f = D[tab][idx], sc = $('scroll');
  sc.innerHTML = '';
  if (!f) {
    $('fname').textContent = '';
    sc.innerHTML = '<div class="empty">Tidak ada file ' + tab.toUpperCase() + ' di halaman ini.</div>';
    return;
  }
  $('fname').textContent = f.n + ' · ' + kb(f.c.length);
  const lines = f.c.split('\n');
  const g = document.createElement('pre'); g.className = 'gutter';
  g.textContent = lines.map((_, i) => i + 1).join('\n');
  const s = document.createElement('pre'); s.className = 'src';
  s.textContent = f.c;
  sc.append(g, s);
}

$('copy').onclick = async () => {
  const f = D[tab][idx]; if (!f) return;
  try { await navigator.clipboard.writeText(f.c); toast('Tersalin'); }
  catch { toast('Gagal menyalin'); }
};
$('dl').onclick = () => {
  const f = D[tab][idx]; if (!f) return;
  let name = f.n.split('?')[0].split('/').pop() || 'source';
  if (!/\.\w+$/.test(name)) name += '.' + tab;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([f.c], {type:'text/plain'}));
  a.download = name; a.click(); URL.revokeObjectURL(a.href);
};
</script>
</body>
</html>
